name: WeRead isolated session renewal diagnosis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install probe dependencies
        run: python -m pip install --disable-pip-version-check requests==2.32.4 retrying==1.4.1
      - name: One bounded renewal and shelf verification
        env:
          WEREAD_COOKIE: ${{ secrets.WEREAD_COOKIE }}
        run: python tools/diagnose_weread.py
